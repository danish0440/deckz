[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
default-members = ["crates/*", "apps/deckz", "apps/deckz-cli"]

[workspace.package]
version = "0.10.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/danish0440/deckz"

[workspace.dependencies]
# internal
deckz-geom = { path = "crates/geom" }
deckz-color = { path = "crates/color" }
deckz-metafile = { path = "crates/metafile" }
deckz-model = { path = "crates/model" }
deckz-fonts = { path = "crates/fonts" }
deckz-text = { path = "crates/text" }
deckz-render = { path = "crates/render" }
deckz-pdf = { path = "crates/pdf" }
deckz-pptx = { path = "crates/pptx" }
deckz-format = { path = "crates/format" }
deckz-anim = { path = "crates/anim" }
deckz-engine = { path = "crates/engine" }
deckz-mcp = { path = "crates/mcp" }
deckz-ui-egui = { path = "crates/ui-egui" }
deckz-media = { path = "crates/media" }
# codecs (ported from FilmZ, same owner and licence)
deckz-bitstream = { path = "crates/bitstream" }
deckz-h264 = { path = "crates/h264" }
deckz-hevc = { path = "crates/hevc" }
deckz-vp9 = { path = "crates/vp9" }
deckz-av1 = { path = "crates/av1" }
deckz-isobmff = { path = "crates/isobmff" }
deckz-matroska = { path = "crates/matroska" }
deckz-ogg = { path = "crates/ogg" }
deckz-opus = { path = "crates/opus" }

# foundation
kurbo = { version = "0.13", features = ["serde"] }
thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
log = "0.4"
proptest = "1"
rayon = "1"
unicode-bidi = "0.3"
unicode-segmentation = "1"
unicode-linebreak = "0.1"
# Base features are wasm-safe (`std` only). The non-wasm `clock` feature is requested
# per-crate for targets that read the local clock (see crates/text).
chrono = { version = "0.4", default-features = false, features = ["std"] }

# text / rendering / formats
skrifa = "0.47"
harfrust = "0.13"
vello_cpu = "0.2"
vello_common = { version = "0.2", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "tiff", "bmp"] }
craft-media = { git = "https://github.com/storytold/craft-libs", rev = "f0ad6c1e1d297908915f4be315b0fcfc9be7b5d4", version = "=0.1.0", default-features = false }
craft-pdf = { git = "https://github.com/storytold/craft-libs", rev = "9f75d3dc19b4b514c4f3d4847ed1ec1b0e86b4ef", version = "=0.1.0", default-features = false, features = ["write", "write-simple-text"] }
i_overlay = "9"
quick-xml = "0.41"
zip = { version = "3", default-features = false, features = ["deflate"] }

# ui
egui = "0.36"
egui_extras = { version = "0.36", default-features = false }
eframe = { version = "0.36", default-features = false }
egui_kittest = "0.36"
rfd = "0.17"
arboard = { version = "3.6", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"
self_named_constructors = "allow"
large_enum_variant = "allow"
result_large_err = "allow"

# Line tables keep file and line in panics and backtraces; full debug info
# for every test binary and dependency would multiply the target dir size.
# The test profile inherits both settings.
[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
debug = 0

[patch.crates-io]
krilla = { git = "https://github.com/storytold/craft-libs", rev = "9f75d3dc19b4b514c4f3d4847ed1ec1b0e86b4ef", version = "=0.8.2" }
