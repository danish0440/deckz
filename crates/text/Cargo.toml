[package]
name = "deckz-text"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "DeckZ text layout: runs to shaped glyph lines with bullets, indents, spacing, alignment, anchoring, autofit and caret hit testing"

[lints]
workspace = true

[dependencies]
deckz-model = { workspace = true }
deckz-geom = { workspace = true }
deckz-color = { workspace = true }
deckz-fonts = { workspace = true }
unicode-linebreak = { workspace = true }
unicode-segmentation = { workspace = true }
unicode-bidi = { workspace = true }

# The local clock for date fields (no clock on wasm: fields keep their saved text).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
chrono = { workspace = true }
