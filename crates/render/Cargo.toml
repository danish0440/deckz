[package]
name = "deckz-render"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "DeckZ renderer: slides, layouts and masters to pixels (vello_cpu): fills, outlines, effects, pictures, text, tables, charts"

[lints]
workspace = true

[dependencies]
deckz-geom = { workspace = true }
deckz-color = { workspace = true }
deckz-metafile = { workspace = true }
deckz-model = { workspace = true }
deckz-anim = { workspace = true }
deckz-fonts = { workspace = true }
deckz-text = { workspace = true }
vello_cpu = { workspace = true }
vello_common = { workspace = true }
image = { workspace = true }
log = { workspace = true }
kurbo = { workspace = true }
skrifa = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
vello_cpu = { workspace = true, features = ["multithreading"] }
